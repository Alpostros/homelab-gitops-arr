# arr-secrets — gluetun's Mullvad WireGuard private key, sealed to arr's own key. The unsealed
# value matches the live Secret, so adoption does NOT restart the pod. The EXISTING arr-secrets
# Secret must be annotated before first sync (or the controller won't overwrite it):
#   kubectl --context arr-lan -n arr annotate secret arr-secrets sealedsecrets.bitnami.com/managed=true
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: arr-secrets
  namespace: arr
spec:
  encryptedData:
    wireguard-private-key: 
  template:
    metadata:
      name: arr-secrets
      namespace: arr
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
    type: Opaque
