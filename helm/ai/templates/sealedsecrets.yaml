# SealedSecrets for the ai namespace — encrypted to arr's OWN sealed-secrets key (undecryptable
# on cerberus). The unsealed Secrets keep the same values the live pods already use, so adoption
# does not restart anything. The `managed: "true"` template annotation marks the resulting Secret
# so the controller owns it; the EXISTING plaintext Secrets must be annotated the same way BEFORE
# first sync (see the plan / the sync steps) or the controller refuses to overwrite them.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openrouter
  namespace: ai
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      name: openrouter
      namespace: ai
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
    type: Opaque
---
# searxng-secret is NEW (created fresh by the controller, not adopting an existing Secret), so it
# needs no pre-annotation. Injected into searxng's settings.yml by the init container.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: searxng-secret
  namespace: ai
spec:
  encryptedData:
    secret-key: 
  template:
    metadata:
      name: searxng-secret
      namespace: ai
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tavily
  namespace: ai
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      name: tavily
      namespace: ai
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
    type: Opaque
