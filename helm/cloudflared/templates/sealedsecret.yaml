# cloudflared-credentials — the tunnel's identity, sealed to the ARR cluster's own sealed-secrets
# key (undecryptable on cerberus; that separation is deliberate — see completed-tasks/arr-gitops-plan.md).
#
# This file is intentionally COMMENTS-ONLY until you seal the real credentials. It renders nothing,
# so a premature sync simply leaves the Deployment waiting on a missing Secret — visible and
# harmless — rather than applying a broken placeholder.
#
# Phase 1 produces the file. On the Mac, with cloudflared installed:
#
#   cloudflared tunnel login                  # browser: pick the fuzzyy.dev zone → writes ~/.cloudflared/cert.pem
#   cloudflared tunnel create homelab-arr     # prints the tunnel UUID → helm/cloudflared/values.yaml tunnel.id
#                                             # and writes ~/.cloudflared/<UUID>.json
#
# Store <UUID>.json in 1Password FIRST — it is the credential that lets anything holding it
# terminate your tunnel, and `tunnel create` is the only time it is written out.
#
# Then seal it against the ARR cluster and paste the output below this comment block:
#
#   kubeseal --context arr-tailscale \
#     --controller-namespace kube-system --controller-name sealed-secrets-controller \
#     --format yaml --namespace arr --name cloudflared-credentials \
#     --from-file=credentials.json=$HOME/.cloudflared/<UUID>.json \
#     < /dev/null
#
# (If your kubeseal build rejects --from-file, build the Secret first and pipe it:
#    kubectl create secret generic cloudflared-credentials -n arr \
#      --from-file=credentials.json=$HOME/.cloudflared/<UUID>.json \
#      --dry-run=client -o yaml | kubeseal --context arr-tailscale \
#      --controller-namespace kube-system --controller-name sealed-secrets-controller --format yaml)
#
# The result is safe to commit — it is only decryptable by arr's controller. The plaintext
# <UUID>.json must NOT be committed to either repo.
#
# ✅ SEALED 2026-08-19 against arr's own key (controller `sealed-secrets-controller`, kube-system).
# Scoped strictly: this decrypts ONLY as name `cloudflared-credentials` in namespace `arr`, and only
# on the arr cluster. Safe to commit. The plaintext lives in 1Password and ~/.cloudflared on the Mac
# and is NOT in either repo.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflared-credentials
  namespace: arr
spec:
  encryptedData:
    credentials.json: 
  template:
    metadata:
      name: cloudflared-credentials
      namespace: arr
