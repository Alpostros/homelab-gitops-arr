# PUBLIC service — the restartedAt annotation is reproduced verbatim so adoption is a zero-diff
# (no rolling restart, no public blip). The config PVC is named pvc-overseerr-config (historical).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-08-02T12:12:49+02:00"
      labels:
        app: seerr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: seerr
          image: "{{ .Values.image }}"
          env:
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - containerPort: 5055
          volumeMounts:
            - name: seerr-config
              mountPath: /app/config
      volumes:
        - name: seerr-config
          persistentVolumeClaim:
            claimName: pvc-overseerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
spec:
  type: NodePort
  selector:
    app: seerr
  ports:
    - port: 5055
      targetPort: 5055
      nodePort: 5055
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-overseerr-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
