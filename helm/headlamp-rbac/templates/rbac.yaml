# Reproduces homelab-docs manifests/headlamp/ro-rbac.yaml (arr) field-for-field for zero-diff adoption.
# headlamp-ro-token's data is populated by k8s (not in git) — the Application ignoreDifferences the
# token's /data so it doesn't sit perpetually OutOfSync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-ro
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-view-extra   # cluster-scoped reads that the built-in `view` role lacks
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingressclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["scheduling.k8s.io"]
  resources: ["priorityclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-ro-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: headlamp-ro
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-ro-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-view-extra
subjects:
- kind: ServiceAccount
  name: headlamp-ro
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-ro-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: headlamp-ro
type: kubernetes.io/service-account-token
