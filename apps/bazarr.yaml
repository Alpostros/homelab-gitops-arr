# bazarr — subtitles (internal, not public). Zero-diff verified (kubectl -n arr diff, exit 0 → no
# pod restart), so straight to automated. Mounts the shared PVCs from the `storage` app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bazarr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arr
  source:
    repoURL: git@github.com:Alpostros/homelab-gitops-arr.git
    targetRevision: main
    path: helm/bazarr
  destination:
    server: https://kubernetes.default.svc
    namespace: arr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
