# Sealed Secrets controller — arr's secrets foundation. Encrypt a Secret into a SealedSecret
# (safe to commit); the controller decrypts it in-cluster. Default controller name/namespace
# so `kubeseal` works with no extra flags.
#
# MANUAL SYNC ON PURPOSE (no `automated` block): the App-of-Apps root registers this app but
# does NOT install it until an explicit sync — so the first controller start (which generates
# the master key) is a deliberate, user-driven step. Flip to automated (prune + selfHeal) once
# the master key is backed up to 1Password. Trigger the one-off install with:
#   kubectl --context arr-lan -n argocd patch app sealed-secrets --type merge \
#     -p '{"operation":{"sync":{"syncStrategy":{"hook":{}}}}}'
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arr
  source:
    repoURL: git@github.com:Alpostros/homelab-gitops-arr.git
    targetRevision: main
    path: helm/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
