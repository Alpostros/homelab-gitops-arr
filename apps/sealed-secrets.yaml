# Sealed Secrets controller — arr's secrets foundation. Encrypt a Secret into a SealedSecret
# (safe to commit); the controller decrypts it in-cluster. Default controller name/namespace
# so `kubeseal` works with no extra flags.
#
# Installed manually 2026-08-17 (first controller start generates the master key); the master
# key was exported to 1Password, so this is now automated (prune + selfHeal) — its steady state,
# matching cerberus. arr's key is its OWN, distinct from cerberus's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arr
  source:
    repoURL: git@github.com:Alpostros/homelab-gitops-arr.git
    targetRevision: main
    path: helm/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
