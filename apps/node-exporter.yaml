# node-exporter — first Phase-4 adoption (lowest blast radius: no secrets, no PVC, and a
# restart would only blip metrics scraping, never a user). Adopted 2026-08-17 with a verified
# zero-diff (kubectl server-side diff exit 0) — pod NOT restarted — so now automated.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arr
  source:
    repoURL: git@github.com:Alpostros/homelab-gitops-arr.git
    targetRevision: main
    path: helm/node-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
